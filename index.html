<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search — Insighta Labs+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">Insighta Labs+</div>
            <nav class="sidebar-nav">
                <a href="index.html" class="active">Search</a>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-ghost" onclick="localStorage.clear(); location.href='login.html'">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="page-title">Natural Language Search</h1>
            <div class="card">
                <div style="display:flex;gap:10px">
                    <input id="search-input" placeholder='e.g. "young males from nigeria"' style="flex:1">
                    <button class="btn" onclick="doSearch()">Search</button>
                </div>
            </div>
            <div id="error-msg" class="error-msg" style="display:none; margin-top:10px;"></div>
            <div id="loader" style="display:none; text-align:center; padding:20px;">Searching...</div>
            <div id="results-container" style="display:none; margin-top:20px;">
                <div class="card" style="padding:0">
                    <table>
                        <thead><tr><th>Name</th><th>Age</th><th>Country</th></tr></thead>
                        <tbody id="results-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = "https://insighta-backend-production-4f18.up.railway.app";

        window.onload = () => {
            const token = new URLSearchParams(window.location.search).get('token');
            if (token) {
                localStorage.setItem('insighta_jwt', token);
                window.history.replaceState({}, document.title, "/index.html");
            }
            if (!localStorage.getItem('insighta_jwt')) window.location.href = "login.html";
        };

        async function doSearch() {
            const q = document.getElementById('search-input').value;
            const loader = document.getElementById('loader');
            const err = document.getElementById('error-msg');
            
            loader.style.display = 'block';
            err.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/api/profiles/search?q=${encodeURIComponent(q)}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('insighta_jwt')}` }
                });
                const d = await res.json();
                if (!res.ok) throw new Error(d.message || "Search failed");

                const tbody = document.getElementById('results-body');
                tbody.innerHTML = d.data.map(p => `
                    <tr><td>${p.name}</td><td>${p.age || '-'}</td><td>${p.country_name || '-'}</td></tr>
                `).join('');
                document.getElementById('results-container').style.display = 'block';
            } catch (e) {
                err.textContent = e.message;
                err.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
